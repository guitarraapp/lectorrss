<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Lector RSS</title>
<style>
  :root { --bg:#f5f5f7; --panel:#fff; --border:#e0e0e5; --text:#1c1c1e; --muted:#8e8e93; --accent:#0a84ff; --unread:#0a84ff; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--border); }
  header h1 { font-size:16px; margin:0; flex:1; }
  button { padding:8px 14px; border:none; border-radius:8px; background:var(--accent); color:#fff; font-size:13px; cursor:pointer; }
  button.secondary { background:transparent; color:var(--accent); border:1px solid var(--border); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  main { flex:1; display:grid; grid-template-columns:260px 1fr 1fr; overflow:hidden; }
  @media(max-width:900px){ main{ grid-template-columns:1fr; grid-template-rows:auto 1fr; } #reader{ display:none; } }
  #sources { background:var(--panel); border-right:1px solid var(--border); overflow-y:auto; padding:8px; }
  #sources h2 { font-size:11px; text-transform:uppercase; color:var(--muted); margin:12px 8px 6px; letter-spacing:.5px; }
  .source-item { display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:8px; cursor:pointer; font-size:13px; }
  .source-item:hover { background:var(--bg); }
  .source-item.active { background:#e3f0ff; color:var(--accent); }
  .source-item .count { margin-left:auto; font-size:11px; background:var(--unread); color:#fff; border-radius:10px; padding:1px 7px; min-width:18px; text-align:center; }
  #list { overflow-y:auto; background:var(--bg); }
  .article { padding:14px 18px; border-bottom:1px solid var(--border); cursor:pointer; background:var(--panel); }
  .article:hover { background:#fafafa; }
  .article.unread { border-left:3px solid var(--unread); }
  .article.read { opacity:.65; }
  .article .title { font-size:14px; font-weight:600; margin-bottom:4px; line-height:1.35; }
  .article .meta { font-size:11px; color:var(--muted); display:flex; gap:10px; }
  .article .snippet { font-size:12px; color:var(--muted); margin-top:6px; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  #reader { background:var(--panel); border-left:1px solid var(--border); overflow-y:auto; padding:24px; }
  #reader .placeholder { color:var(--muted); text-align:center; margin-top:40%; font-size:14px; }
  #reader h2 { font-size:20px; margin:0 0 8px; line-height:1.3; }
  #reader .reader-meta { font-size:12px; color:var(--muted); margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid var(--border); }
  #reader .reader-body { font-size:14px; line-height:1.6; }
  #reader .reader-body img { max-width:100%; height:auto; border-radius:6px; }
  #status { padding:6px 16px; font-size:12px; color:var(--muted); background:var(--panel); border-top:1px solid var(--border); min-height:28px; }
  #status.error { color:#ff3b30; }
</style>
</head>
<body>
<header>
  <h1>📰 Mi Lector RSS</h1>
  <button id="refreshBtn" class="secondary">Actualizar</button>
  <button id="markAllBtn" class="secondary">Marcar todo leído</button>
</header>
<main>
  <aside id="sources"><h2>Fuentes</h2><div id="sourceList"></div></aside>
  <section id="list"></section>
  <section id="reader"><div class="placeholder">Selecciona un artículo</div></section>
</main>
<div id="status">Cargando…</div>
<script>
const state = { sources: [], articles: [], read: new Set(), activeSource: null, activeArticle: null, loading: false };
const $sources = document.getElementById('sourceList');
const $list = document.getElementById('list');
const $reader = document.getElementById('reader');
const $status = document.getElementById('status');
const $refresh = document.getElementById('refreshBtn');
const $markAll = document.getElementById('markAllBtn');

function setStatus(msg, isError=false){ $status.textContent = msg; $status.className = isError ? 'error' : ''; }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function sourceTitle(url){ const s = state.sources.find(x=>x.url===url); return s?.title || url; }
function formatDate(iso){ const d=new Date(iso); if(isNaN(d)) return ''; const diff=(Date.now()-d)/60000; if(diff<60) return `hace ${Math.max(1,Math.round(diff))} min`; if(diff<60*24) return `hace ${Math.round(diff/60)} h`; return d.toLocaleDateString('es-ES',{day:'numeric',month:'short'}); }

function renderSources(){
  $sources.innerHTML='';
  const all=document.createElement('div');
  all.className='source-item'+(state.activeSource===null?' active':'');
  all.innerHTML='<span>🗂️ Todas</span>';
  all.onclick=()=>{state.activeSource=null;renderSources();renderList();};
  $sources.appendChild(all);
  state.sources.forEach(s=>{
    const unread=state.articles.filter(a=>a.sourceUrl===s.url&&!state.read.has(a.id)).length;
    const div=document.createElement('div');
    div.className='source-item'+(state.activeSource===s.url?' active':'');
    div.innerHTML=`<span>📡 ${escapeHtml(s.title||s.url)}</span>${unread?`<span class="count">${unread}</span>`:''}`;
    div.onclick=()=>{state.activeSource=s.url;renderSources();renderList();};
    $sources.appendChild(div);
  });
}
function renderList(){
  let items=state.articles;
  if(state.activeSource) items=items.filter(a=>a.sourceUrl===state.activeSource);
  items=[...items].sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(!items.length){ $list.innerHTML='<div style="padding:40px;text-align:center;color:var(--muted);font-size:13px;">No hay artículos.</div>'; return; }
  $list.innerHTML='';
  items.forEach(a=>{
    const read=state.read.has(a.id);
    const el=document.createElement('div');
    el.className='article '+(read?'read':'unread');
    el.innerHTML=`<div class="title">${escapeHtml(a.title)}</div><div class="meta"><span>${escapeHtml(sourceTitle(a.sourceUrl))}</span><span>${formatDate(a.date)}</span></div><div class="snippet">${escapeHtml(a.snippet)}</div>`;
    el.onclick=()=>openArticle(a);
    $list.appendChild(el);
  });
}
function openArticle(a){
  state.activeArticle=a;
  state.read.add(a.id);
  localStorage.setItem('rss_read_v1', JSON.stringify([...state.read]));
  renderSources(); renderList();
  const body=a.content&&a.content.length>40?sanitizeHtml(a.content):`<p>${escapeHtml(a.snippet)}</p><p><a href="${escapeHtml(a.link)}" target="_blank">Leer original →</a></p>`;
  $reader.innerHTML=`<h2>${escapeHtml(a.title)}</h2><div class="reader-meta">${escapeHtml(sourceTitle(a.sourceUrl))} · ${formatDate(a.date)} · <a href="${escapeHtml(a.link)}" target="_blank">Abrir original</a></div><div class="reader-body">${body}</div>`;
  $reader.scrollTop=0;
}
function sanitizeHtml(html){
  const allowed=new Set(['P','BR','A','STRONG','EM','B','I','U','UL','OL','LI','H1','H2','H3','H4','H5','H6','BLOCKQUOTE','IMG','FIGURE','FIGCAPTION','CODE','PRE','HR','SPAN','DIV']);
  const tpl=document.createElement('template'); tpl.innerHTML=html;
  const walk=node=>{ [...node.children].forEach(child=>{ if(!allowed.has(child.tagName)){child.replaceWith(...child.childNodes);return;} [...child.attributes].forEach(attr=>{if(attr.name.startsWith('on'))child.removeAttribute(attr.name);}); walk(child); }); };
  walk(tpl.content); return tpl.innerHTML;
}
async function loadData(){
  setStatus('Cargando datos…');
  try{
    const res=await fetch('data/feeds.json?t='+Date.now());
    if(!res.ok) throw new Error('No se pudo cargar data/feeds.json (¿has ejecutado la Action?)');
    const data=await res.json();
    state.sources=data.sources||[];
    state.articles=data.articles||[];
    setStatus(`Listo. ${state.sources.length} fuentes, ${state.articles.length} artículos.`);
  }catch(e){ setStatus('Error: '+e.message, true); }
  try{ const saved=localStorage.getItem('rss_read_v1'); if(saved) state.read=new Set(JSON.parse(saved)); }catch(e){}
  renderSources(); renderList();
}
$refresh.onclick=()=>loadData();
$markAll.onclick=()=>{ const items=state.activeSource?state.articles.filter(a=>a.sourceUrl===state.activeSource):state.articles; items.forEach(a=>state.read.add(a.id)); localStorage.setItem('rss_read_v1',JSON.stringify([...state.read])); renderSources(); renderList(); };
loadData();
</script>
</body>
</html>
